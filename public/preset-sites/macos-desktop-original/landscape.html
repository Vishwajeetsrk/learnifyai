<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Procedural Landscape Wallpaper</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
    canvas {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <canvas id="landscapeCanvas"></canvas>

  <script>
    const canvas = document.getElementById('landscapeCanvas');
    const ctx = canvas.getContext('2d');

    // Parse initial URL parameters
    const urlParams = new URLSearchParams(window.location.search);
    let currentVariant = (urlParams.get('variant') || 'noon').toLowerCase();

    // Listen for direct parent postMessages for instant switching
    window.addEventListener('message', (event) => {
      if (event.data && event.data.variant) {
        currentVariant = event.data.variant.toLowerCase();
        initParticles();
      }
    });

    const PRESETS = {
      noon: {
        skyTop: '#9cc8f0', skyBottom: '#cfe3f2',
        sunX: 0.75, sunY: 0.22, sunRadius: 42,
        sunColor: 'rgba(255, 255, 240, 0.95)', sunGlow: 'rgba(255, 245, 200, 0.35)',
        hasMoon: false, hasStars: false, hasRain: false, hasStorm: false, hasSnow: false,
        hill1: '#98b87a', hill2: '#8fa86b', hill3: '#6d8a4e'
      },
      sunrise: {
        skyTop: '#f6c89a', skyBottom: '#f3e1c4',
        sunX: 0.25, sunY: 0.52, sunRadius: 48,
        sunColor: 'rgba(255, 235, 210, 0.95)', sunGlow: 'rgba(255, 180, 120, 0.45)',
        hasMoon: false, hasStars: false, hasRain: false, hasStorm: false, hasSnow: false,
        hill1: '#b8a975', hill2: '#a39566', hill3: '#7d7448'
      },
      sunset: {
        skyTop: '#e98a5b', skyBottom: '#f0b98a',
        sunX: 0.8, sunY: 0.55, sunRadius: 52,
        sunColor: 'rgba(255, 210, 160, 0.98)', sunGlow: 'rgba(240, 110, 60, 0.5)',
        hasMoon: false, hasStars: false, hasRain: false, hasStorm: false, hasSnow: false,
        hill1: '#946f51', hill2: '#7a5d43', hill3: '#4d3b2b'
      },
      night: {
        skyTop: '#0d1a33', skyBottom: '#23365c',
        sunX: 0.82, sunY: 0.2, sunRadius: 36,
        sunColor: 'rgba(240, 245, 255, 0.95)', sunGlow: 'rgba(180, 210, 255, 0.25)',
        hasMoon: true, hasStars: true, hasRain: false, hasStorm: false, hasSnow: false,
        hill1: '#243447', hill2: '#1b2a33', hill3: '#0f1a1f'
      },
      rain: {
        skyTop: '#8d99a6', skyBottom: '#b6bfc8',
        sunX: 0.5, sunY: 0.3, sunRadius: 35,
        sunColor: 'rgba(220, 225, 230, 0.4)', sunGlow: 'rgba(200, 210, 220, 0.15)',
        hasMoon: false, hasStars: false, hasRain: true, hasStorm: false, hasSnow: false,
        hill1: '#748369', hill2: '#5f6e55', hill3: '#47533f'
      },
      storm: {
        skyTop: '#3d3f4f', skyBottom: '#6b6470',
        sunX: 0.5, sunY: 0.3, sunRadius: 30,
        sunColor: 'rgba(180, 180, 195, 0.3)', sunGlow: 'rgba(150, 150, 170, 0.15)',
        hasMoon: false, hasStars: false, hasRain: true, hasStorm: true, hasSnow: false,
        hill1: '#4a4a40', hill2: '#3a3a32', hill3: '#24241f'
      },
      snow: {
        skyTop: '#cdd9e6', skyBottom: '#eef3f8',
        sunX: 0.35, sunY: 0.25, sunRadius: 38,
        sunColor: 'rgba(255, 255, 255, 0.85)', sunGlow: 'rgba(220, 235, 255, 0.3)',
        hasMoon: false, hasStars: false, hasRain: false, hasStorm: false, hasSnow: true,
        hill1: '#f0f4f8', hill2: '#e6ebef', hill3: '#c8d0d8'
      }
    };

    let width = 0;
    let height = 0;
    let dpr = 1;

    function resize() {
      dpr = Math.min(window.devicePixelRatio || 1, 2);
      width = window.innerWidth;
      height = window.innerHeight;
      canvas.width = width * dpr;
      canvas.height = height * dpr;
      ctx.scale(dpr, dpr);
    }
    window.addEventListener('resize', resize);
    resize();

    // Starfield for night
    const stars = Array.from({ length: 140 }, () => ({
      x: Math.random(),
      y: Math.random() * 0.6,
      size: Math.random() * 1.8 + 0.6,
      alpha: Math.random() * 0.7 + 0.3,
      pulseSpeed: Math.random() * 0.03 + 0.01,
      phase: Math.random() * Math.PI * 2
    }));

    // Rain particles
    let rainDrops = [];
    // Snow particles
    let snowFlakes = [];
    // Lightning state
    let lightningTimer = 0;
    let lightningOpacity = 0;
    let lightningBranches = [];

    function initParticles() {
      rainDrops = Array.from({ length: 220 }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        length: Math.random() * 20 + 12,
        speed: Math.random() * 14 + 16,
        alpha: Math.random() * 0.4 + 0.25
      }));

      snowFlakes = Array.from({ length: 160 }, () => ({
        x: Math.random() * width,
        y: Math.random() * height,
        radius: Math.random() * 2.8 + 1.2,
        speedY: Math.random() * 1.5 + 0.8,
        speedX: Math.random() * 0.8 - 0.4,
        alpha: Math.random() * 0.6 + 0.4,
        swayPhase: Math.random() * Math.PI * 2
      }));
    }
    initParticles();

    function triggerLightning() {
      lightningOpacity = 0.9;
      lightningBranches = [];
      const startX = Math.random() * width * 0.7 + width * 0.15;
      let currX = startX;
      let currY = 0;
      const points = [{ x: currX, y: currY }];
      while (currY < height * 0.65) {
        currX += (Math.random() - 0.5) * 45;
        currY += Math.random() * 35 + 15;
        points.push({ x: currX, y: currY });
      }
      lightningBranches.push(points);
    }

    let time = 0;

    function render() {
      time += 0.016;
      ctx.clearRect(0, 0, width, height);

      const preset = PRESETS[currentVariant] || PRESETS.noon;

      // 1. Sky Gradient
      const skyGrad = ctx.createLinearGradient(0, 0, 0, height);
      skyGrad.addColorStop(0, preset.skyTop);
      skyGrad.addColorStop(0.55, preset.skyBottom);
      skyGrad.addColorStop(1, preset.hill3);
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, width, height);

      // 2. Stars for Night
      if (preset.hasStars) {
        stars.forEach(s => {
          const a = s.alpha + Math.sin(time * s.pulseSpeed * 60 + s.phase) * 0.25;
          ctx.fillStyle = `rgba(255, 255, 255, ${Math.max(0.1, Math.min(1, a))})`;
          ctx.beginPath();
          ctx.arc(s.x * width, s.y * height, s.size, 0, Math.PI * 2);
          ctx.fill();
        });
      }

      // 3. Sun or Moon
      const sunCenterX = preset.sunX * width;
      const sunCenterY = preset.sunY * height;

      // Outer radial glow
      const glowGrad = ctx.createRadialGradient(
        sunCenterX, sunCenterY, 5,
        sunCenterX, sunCenterY, preset.sunRadius * 3.5
      );
      glowGrad.addColorStop(0, preset.sunGlow);
      glowGrad.addColorStop(1, 'rgba(255, 255, 255, 0)');
      ctx.fillStyle = glowGrad;
      ctx.beginPath();
      ctx.arc(sunCenterX, sunCenterY, preset.sunRadius * 3.5, 0, Math.PI * 2);
      ctx.fill();

      // Disc
      ctx.fillStyle = preset.sunColor;
      ctx.beginPath();
      ctx.arc(sunCenterX, sunCenterY, preset.sunRadius, 0, Math.PI * 2);
      ctx.fill();

      // Moon Crescent Cutout
      if (preset.hasMoon) {
        ctx.fillStyle = preset.skyTop;
        ctx.beginPath();
        ctx.arc(sunCenterX + preset.sunRadius * 0.38, sunCenterY - preset.sunRadius * 0.1, preset.sunRadius * 0.85, 0, Math.PI * 2);
        ctx.fill();
      }

      // 4. Background Hills (Layer 1)
      ctx.fillStyle = preset.hill1;
      ctx.beginPath();
      ctx.moveTo(0, height);
      ctx.lineTo(0, height * 0.58);
      ctx.bezierCurveTo(
        width * 0.25, height * 0.52,
        width * 0.45, height * 0.62,
        width * 0.7, height * 0.54
      );
      ctx.bezierCurveTo(
        width * 0.85, height * 0.50,
        width * 0.95, height * 0.56,
        width, height * 0.53
      );
      ctx.lineTo(width, height);
      ctx.closePath();
      ctx.fill();

      // 5. Midground Hills (Layer 2)
      ctx.fillStyle = preset.hill2;
      ctx.beginPath();
      ctx.moveTo(0, height);
      ctx.lineTo(0, height * 0.66);
      ctx.bezierCurveTo(
        width * 0.18, height * 0.61,
        width * 0.38, height * 0.72,
        width * 0.62, height * 0.64
      );
      ctx.bezierCurveTo(
        width * 0.8, height * 0.59,
        width * 0.92, height * 0.68,
        width, height * 0.64
      );
      ctx.lineTo(width, height);
      ctx.closePath();
      ctx.fill();

      // 6. Foreground Rolling Hill (Layer 3)
      ctx.fillStyle = preset.hill3;
      ctx.beginPath();
      ctx.moveTo(0, height);
      ctx.lineTo(0, height * 0.76);
      ctx.bezierCurveTo(
        width * 0.3, height * 0.71,
        width * 0.5, height * 0.83,
        width * 0.8, height * 0.74
      );
      ctx.bezierCurveTo(
        width * 0.9, height * 0.71,
        width * 0.96, height * 0.78,
        width, height * 0.75
      );
      ctx.lineTo(width, height);
      ctx.closePath();
      ctx.fill();

      // 7. Rain Weather Effect
      if (preset.hasRain) {
        ctx.strokeStyle = 'rgba(210, 225, 240, 0.45)';
        ctx.lineWidth = 1.2;
        ctx.beginPath();
        rainDrops.forEach(drop => {
          ctx.moveTo(drop.x, drop.y);
          ctx.lineTo(drop.x - 3, drop.y + drop.length);
          drop.y += drop.speed;
          drop.x -= 1.8;
          if (drop.y > height) {
            drop.y = -drop.length;
            drop.x = Math.random() * (width + 100);
          }
        });
        ctx.stroke();
      }

      // 8. Storm Lightning
      if (preset.hasStorm) {
        lightningTimer += 0.016;
        if (lightningTimer > 3.5 + Math.random() * 4) {
          triggerLightning();
          lightningTimer = 0;
        }

        if (lightningOpacity > 0.02) {
          // Screen flash
          ctx.fillStyle = `rgba(255, 255, 255, ${lightningOpacity * 0.35})`;
          ctx.fillRect(0, 0, width, height);

          // Lightning bolts
          ctx.strokeStyle = `rgba(255, 255, 255, ${lightningOpacity})`;
          ctx.lineWidth = 2.5;
          ctx.shadowColor = 'rgba(200, 230, 255, 0.9)';
          ctx.shadowBlur = 12;
          lightningBranches.forEach(branch => {
            ctx.beginPath();
            branch.forEach((pt, i) => {
              if (i === 0) ctx.moveTo(pt.x, pt.y);
              else ctx.lineTo(pt.x, pt.y);
            });
            ctx.stroke();
          });
          ctx.shadowBlur = 0;
          lightningOpacity *= 0.88;
        }
      }

      // 9. Snow Weather Effect
      if (preset.hasSnow) {
        ctx.fillStyle = 'rgba(255, 255, 255, 0.85)';
        snowFlakes.forEach(flake => {
          ctx.beginPath();
          ctx.arc(flake.x, flake.y, flake.radius, 0, Math.PI * 2);
          ctx.fill();

          flake.y += flake.speedY;
          flake.x += Math.sin(time + flake.swayPhase) * 0.8 + flake.speedX;

          if (flake.y > height + 10) {
            flake.y = -10;
            flake.x = Math.random() * width;
          }
        });
      }

      requestAnimationFrame(render);
    }

    requestAnimationFrame(render);
  </script>
</body>
</html>
