<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="720" viewBox="0 0 1280 720">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#bg)"/>
  <circle cx="1100" cy="120" r="180" fill="#6366f1" opacity="0.18"/>
  <circle cx="180" cy="620" r="220" fill="#a855f7" opacity="0.14"/>
  <circle cx="640" cy="360" r="260" fill="#818cf8" opacity="0.07"/>
  <g filter="url(#glow)">
    <rect x="470" y="180" width="220" height="150" rx="16" fill="none" stroke="url(#accent)" stroke-width="4"/>
    <rect x="510" y="215" width="220" height="150" rx="16" fill="none" stroke="#e0e7ff" stroke-width="4" opacity="0.9"/>
    <rect x="550" y="250" width="220" height="150" rx="16" fill="#1e293b" stroke="#818cf8" stroke-width="4"/>
    <path d="M610 320 l30 30 l60 -70" fill="none" stroke="#34d399" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <text x="640" y="500" text-anchor="middle" font-family="system-ui, sans-serif" font-size="64" font-weight="800" fill="#ffffff">Template Mastery</text>
  <text x="640" y="550" text-anchor="middle" font-family="system-ui, sans-serif" font-size="24" fill="#a5b4fc">From template to production-ready website — free</text>
  <g transform="translate(560, 590)">
    <rect x="0" y="0" width="160" height="40" rx="20" fill="url(#accent)"/>
    <text x="80" y="26" text-anchor="middle" font-family="system-ui, sans-serif" font-size="16" font-weight="700" fill="#fff">Start Learning</text>
  </g>
</svg>
