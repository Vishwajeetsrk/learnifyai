<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-java" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141124" />
      <stop offset="50%" stop-color="#0e1322" />
      <stop offset="100%" stop-color="#080711" />
    </linearGradient>
    <linearGradient id="accent-java" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>
    <filter id="glow-orange" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg-java)" />

  <!-- Grid overlay -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <path d="M0 75h800M0 150h800M0 225h800M0 300h800M0 375h800" />
    <path d="M100 0v450M200 0v450M300 0v450M400 0v450M500 0v450M600 0v450M700 0v450" />
  </g>

  <!-- Ambient Orbs -->
  <circle cx="680" cy="140" r="160" fill="#ea580c" opacity="0.18" filter="url(#glow-orange)" />
  <circle cx="640" cy="320" r="130" fill="#38bdf8" opacity="0.12" filter="url(#glow-orange)" />

  <!-- Brand Tag -->
  <g transform="translate(60, 50)">
    <rect width="142" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18" />
    <circle cx="18" cy="16" r="4.5" fill="#ea580c" />
    <text x="32" y="20.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#E2E8F0" letter-spacing="1.2">LEARNIFY AI</text>
  </g>

  <!-- Java Emblem (Coffee Cup & Steam) -->
  <g transform="translate(620, 160)">
    <rect x="-10" y="-10" width="110" height="110" rx="24" fill="#ea580c" fill-opacity="0.12" stroke="#ea580c" stroke-width="1.5" stroke-opacity="0.35" />
    <!-- Steam Curves -->
    <path d="M35 15 Q45 5 40 -5 Q35 -15 45 -22" stroke="#f97316" stroke-width="3.5" fill="none" stroke-linecap="round" opacity="0.8" />
    <path d="M50 18 Q60 8 55 -2 Q50 -12 60 -19" stroke="#38bdf8" stroke-width="3" fill="none" stroke-linecap="round" opacity="0.8" />
    <!-- Cup Body -->
    <path d="M20 25 h50 c0 25 -10 45 -25 45 s-25 -20 -25 -45 z" fill="#f97316" />
    <!-- Handle -->
    <path d="M70 30 h10 c5 0 8 5 8 10 s-3 10 -8 10 h-10" stroke="#f97316" stroke-width="4" fill="none" stroke-linecap="round" />
    <!-- Saucer -->
    <path d="M15 75 h60" stroke="#38bdf8" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Course Title -->
  <g transform="translate(60, 180)">
    <rect x="0" y="-30" width="100" height="5" rx="2.5" fill="url(#accent-java)" />
    <text x="0" y="2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#FB923C" letter-spacing="1.5" text-transform="uppercase">BACKEND &amp; SYSTEM PROGRAMMING</text>
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Space Grotesk', 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">Java Fundamentals</text>
    <text x="0" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Space Grotesk', 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="800" fill="#FB923C" letter-spacing="-0.5">Zero to Enterprise OOP</text>
    <text x="0" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#94A3B8">Classes &amp; Objects • Collections Framework • Exception Handling • 3 Billion Devices</text>
  </g>

  <!-- Badges at bottom -->
  <g transform="translate(60, 375)">
    <rect width="105" height="32" rx="8" fill="#ea580c" fill-opacity="0.2" stroke="#ea580c" stroke-opacity="0.5" />
    <text x="18" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#FB923C" letter-spacing="0.5">CERTIFIED</text>

    <rect x="118" y="0" width="130" height="32" rx="8" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.15" />
    <text x="134" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#CBD5E1">7 Core Lessons</text>

    <rect x="260" y="0" width="115" height="32" rx="8" fill="#38BDF8" fill-opacity="0.15" stroke="#38BDF8" stroke-opacity="0.3" />
    <text x="276" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#7DD3FC">Interactive IDE</text>
  </g>
</svg>
