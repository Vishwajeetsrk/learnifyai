<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-js" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191708" />
      <stop offset="50%" stop-color="#141416" />
      <stop offset="100%" stop-color="#050508" />
    </linearGradient>
    <filter id="glow-js" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg-js)" />

  <!-- Ambient Glows -->
  <circle cx="620" cy="180" r="160" fill="#F7DF1E" opacity="0.18" filter="url(#glow-js)" />
  <circle cx="700" cy="270" r="140" fill="#EAB308" opacity="0.14" filter="url(#glow-js)" />

  <!-- Grid mesh -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
    <path d="M0 75h800M0 150h800M0 225h800M0 300h800M0 375h800" />
    <path d="M100 0v450M200 0v450M300 0v450M400 0v450M500 0v450M600 0v450M700 0v450" />
  </g>

  <!-- Brand Badge Top Left -->
  <g transform="translate(60, 50)">
    <rect width="140" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18" />
    <circle cx="18" cy="16" r="4.5" fill="#F7DF1E" />
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#E2E8F0" letter-spacing="1.2">LEARNIFY AI</text>
  </g>

  <!-- Category Tag -->
  <g transform="translate(60, 96)">
    <rect width="90" height="24" rx="6" fill="#F7DF1E" fill-opacity="0.15" stroke="#F7DF1E" stroke-opacity="0.35" />
    <text x="12" y="16.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FACC15" letter-spacing="0.5">WEB DEV</text>
  </g>

  <!-- Left Content Info -->
  <g transform="translate(60, 185)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">JavaScript Zero to Pro</text>
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#94A3B8">DOM Manipulation • ES6+ • Promises &amp; Async • Web APIs</text>
    
    <!-- Highlights pills -->
    <g transform="translate(0, 75)">
      <rect width="138" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12" />
      <circle cx="14" cy="14" r="3" fill="#F7DF1E" />
      <text x="24" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#CBD5E1">Modern ES2026</text>
    </g>
    <g transform="translate(148, 75)">
      <rect width="134" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12" />
      <circle cx="14" cy="14" r="3" fill="#38BDF8" />
      <text x="24" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#CBD5E1">Async / Await</text>
    </g>
    <g transform="translate(292, 75)">
      <rect width="138" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12" />
      <circle cx="14" cy="14" r="3" fill="#10B981" />
      <text x="24" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#CBD5E1">DOM Projects</text>
    </g>
  </g>

  <!-- Right Visual: Official JS Yellow Badge -->
  <g transform="translate(620, 220)">
    <!-- Container -->
    <rect x="-105" y="-105" width="210" height="210" rx="36" fill="#141416" fill-opacity="0.85" stroke="#F7DF1E" stroke-opacity="0.25" stroke-width="2" />
    
    <!-- JavaScript Iconic Yellow Square with JS Monogram -->
    <rect x="-65" y="-65" width="130" height="130" rx="20" fill="#F7DF1E" />
    <text x="45" y="45" text-anchor="end" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#000000" letter-spacing="-2">JS</text>
  </g>

  <!-- Bottom Bar: Verified Certification -->
  <g transform="translate(60, 375)">
    <rect width="180" height="30" rx="8" fill="#F7DF1E" fill-opacity="0.15" stroke="#F7DF1E" stroke-opacity="0.4" />
    <path d="M16 15l3 3 6-6" fill="none" stroke="#FACC15" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="32" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#FACC15" letter-spacing="0.5">FULL-STACK CERTIFIED</text>
  </g>
</svg>