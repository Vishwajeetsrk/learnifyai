<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-py" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A192F" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="py-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#387EB8" />
      <stop offset="100%" stop-color="#2D6391" />
    </linearGradient>
    <linearGradient id="py-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE873" />
      <stop offset="100%" stop-color="#FFD43B" />
    </linearGradient>
    <filter id="glow-py" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg-py)" />

  <!-- Ambient Glows -->
  <circle cx="620" cy="180" r="160" fill="#387EB8" opacity="0.22" filter="url(#glow-py)" />
  <circle cx="700" cy="270" r="140" fill="#FFD43B" opacity="0.18" filter="url(#glow-py)" />

  <!-- Grid mesh -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
    <path d="M0 75h800M0 150h800M0 225h800M0 300h800M0 375h800" />
    <path d="M100 0v450M200 0v450M300 0v450M400 0v450M500 0v450M600 0v450M700 0v450" />
  </g>

  <!-- Brand Badge Top Left -->
  <g transform="translate(60, 50)">
    <rect width="140" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18" />
    <circle cx="18" cy="16" r="4.5" fill="#387EB8" />
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#E2E8F0" letter-spacing="1.2">LEARNIFY AI</text>
  </g>

  <!-- Category Tag -->
  <g transform="translate(60, 96)">
    <rect width="124" height="24" rx="6" fill="#387EB8" fill-opacity="0.15" stroke="#387EB8" stroke-opacity="0.35" />
    <text x="12" y="16.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#60A5FA" letter-spacing="0.5">PROGRAMMING</text>
  </g>

  <!-- Left Content Info -->
  <g transform="translate(60, 185)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">Python for Everyone</text>
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#94A3B8">Syntax • Data Structures • OOP • Automation • AI APIs</text>
    
    <!-- Highlights pills -->
    <g transform="translate(0, 75)">
      <rect width="138" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12" />
      <circle cx="14" cy="14" r="3" fill="#387EB8" />
      <text x="24" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#CBD5E1">Zero-to-Hero Path</text>
    </g>
    <g transform="translate(148, 75)">
      <rect width="130" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12" />
      <circle cx="14" cy="14" r="3" fill="#FFD43B" />
      <text x="24" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#CBD5E1">Pandas &amp; Data</text>
    </g>
    <g transform="translate(288, 75)">
      <rect width="138" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12" />
      <circle cx="14" cy="14" r="3" fill="#10B981" />
      <text x="24" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#CBD5E1">Script Automation</text>
    </g>
  </g>

  <!-- Right Visual: Official Python Dual-Snake Emblem -->
  <g transform="translate(620, 220)">
    <!-- Glass Backdrop -->
    <rect x="-105" y="-105" width="210" height="210" rx="36" fill="#0F172A" fill-opacity="0.85" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2" />
    
    <!-- Python Snake Emblem Scale -->
    <g transform="translate(-60, -60) scale(1.2)">
      <!-- Blue Snake (Top-Left) -->
      <path d="M49.6 0c-13.6 0-24 5.6-24 16.5v11.9h24.5v3.6H17.8C7.4 32 0 39.8 0 54.4c0 14.5 7.4 22.4 17.8 22.4h7.8v-11c0-12.3 10.4-23.2 24-23.2h24.5c9.3 0 16.3-7.2 16.3-16.5V16.5C90.4 5.6 79.7 0 66.1 0H49.6zM37.8 9.5c3.2 0 5.8 2.6 5.8 5.8s-2.6 5.8-5.8 5.8-5.8-2.6-5.8-5.8 2.6-5.8 5.8-5.8z" fill="url(#py-blue)" />
      <!-- Yellow Snake (Bottom-Right) -->
      <path d="M50.4 100c13.6 0 24-5.6 24-16.5V71.6H49.9V68h32.3c10.4 0 17.8-7.8 17.8-22.4 0-14.5-7.4-22.4-17.8-22.4h-7.8v11c0 12.3-10.4 23.2-24 23.2H45.9c-9.3 0-16.3 7.2-16.3 16.5v9.6c0 10.9 10.7 16.5 24.3 16.5h16.5zm11.8-9.5c-3.2 0-5.8-2.6-5.8-5.8s2.6-5.8 5.8-5.8 5.8 2.6 5.8 5.8-2.6 5.8-5.8 5.8z" fill="url(#py-yellow)" />
    </g>
  </g>

  <!-- Bottom Bar: Verified Certification -->
  <g transform="translate(60, 375)">
    <rect width="180" height="30" rx="8" fill="#387EB8" fill-opacity="0.15" stroke="#387EB8" stroke-opacity="0.4" />
    <path d="M16 15l3 3 6-6" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="32" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#60A5FA" letter-spacing="0.5">CAREER CERTIFIED</text>
  </g>
</svg>