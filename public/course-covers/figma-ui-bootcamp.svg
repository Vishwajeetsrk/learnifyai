<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-figma" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140D26" />
      <stop offset="50%" stop-color="#0F0C20" />
      <stop offset="100%" stop-color="#05030A" />
    </linearGradient>
    <filter id="glow-figma" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg-figma)" />

  <!-- Ambient Glows in Figma brand hues -->
  <circle cx="640" cy="180" r="160" fill="#A259FF" opacity="0.18" filter="url(#glow-figma)" />
  <circle cx="700" cy="300" r="130" fill="#0ACF83" opacity="0.15" filter="url(#glow-figma)" />
  <circle cx="180" cy="100" r="120" fill="#F24E1E" opacity="0.12" filter="url(#glow-figma)" />

  <!-- Grid mesh -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
    <path d="M0 75h800M0 150h800M0 225h800M0 300h800M0 375h800" />
    <path d="M100 0v450M200 0v450M300 0v450M400 0v450M500 0v450M600 0v450M700 0v450" />
  </g>

  <!-- Brand Badge Top Left -->
  <g transform="translate(60, 50)">
    <rect width="140" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18" />
    <circle cx="18" cy="16" r="4.5" fill="#A259FF" />
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#E2E8F0" letter-spacing="1.2">LEARNIFY AI</text>
  </g>

  <!-- Category Tag -->
  <g transform="translate(60, 96)">
    <rect width="78" height="24" rx="6" fill="#A259FF" fill-opacity="0.15" stroke="#A259FF" stroke-opacity="0.35" />
    <text x="12" y="16.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#C084FC" letter-spacing="0.5">DESIGN</text>
  </g>

  <!-- Left Content Info -->
  <g transform="translate(60, 185)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">Figma UI Bootcamp</text>
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#94A3B8">Auto Layout • Components • Design Systems • Hand-off</text>
    
    <!-- Highlights pills -->
    <g transform="translate(0, 75)">
      <rect width="128" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12" />
      <circle cx="14" cy="14" r="3" fill="#A259FF" />
      <text x="24" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#CBD5E1">Auto Layout 5.0</text>
    </g>
    <g transform="translate(138, 75)">
      <rect width="138" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12" />
      <circle cx="14" cy="14" r="3" fill="#0ACF83" />
      <text x="24" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#CBD5E1">Token Variables</text>
    </g>
    <g transform="translate(286, 75)">
      <rect width="142" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12" />
      <circle cx="14" cy="14" r="3" fill="#F24E1E" />
      <text x="24" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#CBD5E1">Interactive Protos</text>
    </g>
  </g>

  <!-- Right Visual: Official Figma 5-Shape Mark & Glass Frame -->
  <g transform="translate(620, 225)">
    <!-- Canvas Frame Backplate -->
    <rect x="-105" y="-105" width="210" height="210" rx="36" fill="#181329" fill-opacity="0.85" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2" />
    
    <!-- Figma Official 5-Piece Mark -->
    <g transform="translate(-32, -64)">
      <!-- Top Left: Red/Orange rounded rect -->
      <path d="M0,0 h32 a16,16 0 0 1 16,16 a16,16 0 0 1 -16,16 h-32 z" fill="#F24E1E" transform="scale(-1,1) translate(-32,0)" />
      <!-- Top Right: Pink/Coral circle -->
      <circle cx="48" cy="16" r="16" fill="#FF7262" />
      
      <!-- Middle Left: Violet rounded rect -->
      <path d="M0,32 h32 a16,16 0 0 1 16,16 a16,16 0 0 1 -16,16 h-32 z" fill="#A259FF" transform="scale(-1,1) translate(-32,0)" />
      <!-- Middle Right: Cyan/Blue circle -->
      <circle cx="48" cy="48" r="16" fill="#1ABCFE" />
      
      <!-- Bottom Left: Green teardrop -->
      <path d="M16,64 h16 v16 a16,16 0 0 1 -16,16 a16,16 0 0 1 -16,-16 a16,16 0 0 1 16,-16 z" fill="#0ACF83" />
    </g>

    <!-- Auto layout handles overlay -->
    <rect x="-85" y="-85" width="170" height="170" rx="20" fill="none" stroke="#A259FF" stroke-opacity="0.3" stroke-dasharray="4 4" />
  </g>

  <!-- Bottom Bar: Certificate Tag -->
  <g transform="translate(60, 375)">
    <rect width="180" height="30" rx="8" fill="#A259FF" fill-opacity="0.15" stroke="#A259FF" stroke-opacity="0.4" />
    <path d="M16 15l3 3 6-6" fill="none" stroke="#C084FC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="32" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#C084FC" letter-spacing="0.5">PORTFOLIO READY</text>
  </g>
</svg>