<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-gsuite" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0A1128" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <linearGradient id="g-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4285F4" />
      <stop offset="100%" stop-color="#1A73E8" />
    </linearGradient>
    <linearGradient id="g-green" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34A853" />
      <stop offset="100%" stop-color="#0F9D58" />
    </linearGradient>
    <linearGradient id="g-yellow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FBBC05" />
      <stop offset="100%" stop-color="#F29900" />
    </linearGradient>
    <linearGradient id="g-red" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EA4335" />
      <stop offset="100%" stop-color="#D93025" />
    </linearGradient>
    <filter id="glow-gsuite" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg-gsuite)" />

  <!-- Ambient Glows -->
  <circle cx="640" cy="180" r="160" fill="#4285F4" opacity="0.16" filter="url(#glow-gsuite)" />
  <circle cx="720" cy="300" r="130" fill="#34A853" opacity="0.14" filter="url(#glow-gsuite)" />
  <circle cx="160" cy="80" r="120" fill="#EA4335" opacity="0.1" filter="url(#glow-gsuite)" />

  <!-- Grid mesh -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
    <path d="M0 75h800M0 150h800M0 225h800M0 300h800M0 375h800" />
    <path d="M100 0v450M200 0v450M300 0v450M400 0v450M500 0v450M600 0v450M700 0v450" />
  </g>

  <!-- Brand Badge Top Left -->
  <g transform="translate(60, 50)">
    <rect width="140" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18" />
    <circle cx="18" cy="16" r="4.5" fill="#4285F4" />
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#E2E8F0" letter-spacing="1.2">LEARNIFY AI</text>
  </g>

  <!-- Category Tag -->
  <g transform="translate(60, 96)">
    <rect width="112" height="24" rx="6" fill="#38BDF8" fill-opacity="0.15" stroke="#38BDF8" stroke-opacity="0.35" />
    <text x="12" y="16.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="0.5">PRODUCTIVITY</text>
  </g>

  <!-- Left Content Info -->
  <g transform="translate(60, 185)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">Google Workspace Pro</text>
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#94A3B8">Gmail • Docs • Sheets • Slides • Drive • Meet</text>
    
    <!-- Highlights pills -->
    <g transform="translate(0, 75)">
      <rect width="145" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12" />
      <circle cx="14" cy="14" r="3" fill="#4285F4" />
      <text x="24" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#CBD5E1">Automated Workflows</text>
    </g>
    <g transform="translate(155, 75)">
      <rect width="128" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12" />
      <circle cx="14" cy="14" r="3" fill="#34A853" />
      <text x="24" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#CBD5E1">Smart Formulas</text>
    </g>
    <g transform="translate(293, 75)">
      <rect width="138" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12" />
      <circle cx="14" cy="14" r="3" fill="#EA4335" />
      <text x="24" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#CBD5E1">AI-Powered Docs</text>
    </g>
  </g>

  <!-- Right Visual: Google Workspace 4-Color Hub -->
  <g transform="translate(580, 220)">
    <!-- Central Glass Hexagon Card -->
    <rect x="-100" y="-100" width="200" height="200" rx="32" fill="#0F172A" fill-opacity="0.85" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2" />
    
    <!-- Google 4-Color Multi-Service Emblem -->
    <!-- Gmail Red Envelope -->
    <g transform="translate(-60, -60)">
      <rect width="44" height="44" rx="10" fill="#EA4335" fill-opacity="0.15" stroke="#EA4335" stroke-opacity="0.4" />
      <path d="M12 16l10 7 10-7v12H12V16z" fill="none" stroke="#EA4335" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Google Drive Triangle (Green/Yellow/Blue) -->
    <g transform="translate(16, -60)">
      <rect width="44" height="44" rx="10" fill="#FBBC05" fill-opacity="0.15" stroke="#FBBC05" stroke-opacity="0.4" />
      <path d="M22 13l9 17H13l9-17z" fill="none" stroke="#FBBC05" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Google Sheets Green Grid -->
    <g transform="translate(-60, 16)">
      <rect width="44" height="44" rx="10" fill="#34A853" fill-opacity="0.15" stroke="#34A853" stroke-opacity="0.4" />
      <path d="M15 14h14v16H15V14zm0 6h14m-8-6v16" fill="none" stroke="#34A853" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Google Docs Blue Document -->
    <g transform="translate(16, 16)">
      <rect width="44" height="44" rx="10" fill="#4285F4" fill-opacity="0.15" stroke="#4285F4" stroke-opacity="0.4" />
      <path d="M15 13h10l4 4v14H15V13zm3 7h8m-8 4h6" fill="none" stroke="#4285F4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>

    <!-- Center Google Hub Badge -->
    <circle cx="0" cy="0" r="18" fill="#1E293B" stroke="#4285F4" stroke-width="2" />
    <text x="0" y="5" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="900" fill="#FFFFFF">G</text>
  </g>

  <!-- Bottom Bar: Verified Certification -->
  <g transform="translate(60, 375)">
    <rect width="180" height="30" rx="8" fill="#4285F4" fill-opacity="0.15" stroke="#4285F4" stroke-opacity="0.4" />
    <path d="M16 15l3 3 6-6" fill="none" stroke="#4285F4" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="32" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#60A5FA" letter-spacing="0.5">OFFICIAL CERTIFICATION</text>
  </g>
</svg>