<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-tools" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1626" />
      <stop offset="50%" stop-color="#0F172A" />
      <stop offset="100%" stop-color="#030712" />
    </linearGradient>
    <filter id="glow-tools" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg-tools)" />

  <!-- Ambient Glows -->
  <circle cx="580" cy="180" r="160" fill="#007ACC" opacity="0.22" filter="url(#glow-tools)" />
  <circle cx="700" cy="270" r="140" fill="#F05032" opacity="0.2" filter="url(#glow-tools)" />

  <!-- Grid mesh -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
    <path d="M0 75h800M0 150h800M0 225h800M0 300h800M0 375h800" />
    <path d="M100 0v450M200 0v450M300 0v450M400 0v450M500 0v450M600 0v450M700 0v450" />
  </g>

  <!-- Brand Badge Top Left -->
  <g transform="translate(60, 50)">
    <rect width="140" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18" />
    <circle cx="18" cy="16" r="4.5" fill="#007ACC" />
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#E2E8F0" letter-spacing="1.2">LEARNIFY AI</text>
  </g>

  <!-- Category Tag -->
  <g transform="translate(60, 96)">
    <rect width="128" height="24" rx="6" fill="#007ACC" fill-opacity="0.15" stroke="#007ACC" stroke-opacity="0.35" />
    <text x="12" y="16.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#38BDF8" letter-spacing="0.5">DEVELOPER TOOLS</text>
  </g>

  <!-- Left Content Info -->
  <g transform="translate(60, 185)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">VS Code + Git Essentials</text>
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#94A3B8">Power Shortcuts • Extensions • Git Workflow • GitHub CI</text>
    
    <!-- Highlights pills -->
    <g transform="translate(0, 75)">
      <rect width="138" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12" />
      <circle cx="14" cy="14" r="3" fill="#007ACC" />
      <text x="24" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#CBD5E1">VS Code Mastery</text>
    </g>
    <g transform="translate(148, 75)">
      <rect width="134" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12" />
      <circle cx="14" cy="14" r="3" fill="#F05032" />
      <text x="24" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#CBD5E1">Git &amp; Branches</text>
    </g>
    <g transform="translate(292, 75)">
      <rect width="138" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12" />
      <circle cx="14" cy="14" r="3" fill="#10B981" />
      <text x="24" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#CBD5E1">GitHub Actions</text>
    </g>
  </g>

  <!-- Right Visual: VS Code Ribbon + Git Branching Tree -->
  <g transform="translate(610, 220)">
    <!-- Container -->
    <rect x="-115" y="-105" width="230" height="210" rx="36" fill="#0F172A" fill-opacity="0.85" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2" />
    
    <!-- VS Code Badge (Left) -->
    <g transform="translate(-75, -50)">
      <rect width="80" height="95" rx="16" fill="#007ACC" fill-opacity="0.2" stroke="#007ACC" stroke-opacity="0.4" stroke-width="1.5" />
      <!-- VS Code stylized infinity/ribbon -->
      <path d="M56 18l-30 24 30 24 10-5V23z" fill="#007ACC" />
      <path d="M26 42l30 24V24z" fill="#1F9CF0" />
      <path d="M16 35l10-7 10 7-10 7z" fill="#0065A9" />
    </g>

    <!-- Git Diamond Badge (Right) -->
    <g transform="translate(10, -50)">
      <rect width="80" height="95" rx="16" fill="#F05032" fill-opacity="0.2" stroke="#F05032" stroke-opacity="0.4" stroke-width="1.5" />
      <!-- Git Branch Nodes -->
      <g transform="translate(40, 48) rotate(45)">
        <rect x="-22" y="-22" width="44" height="44" rx="8" fill="#F05032" />
        <circle cx="-6" cy="6" r="4" fill="#FFFFFF" />
        <circle cx="6" cy="-6" r="4" fill="#FFFFFF" />
        <circle cx="-6" cy="-6" r="4" fill="#FFFFFF" />
        <line x1="-6" y1="-6" x2="-6" y2="6" stroke="#FFFFFF" stroke-width="2.5" />
        <line x1="-6" y1="-6" x2="6" y2="-6" stroke="#FFFFFF" stroke-width="2.5" />
      </g>
    </g>
  </g>

  <!-- Bottom Bar: Verified Certification -->
  <g transform="translate(60, 375)">
    <rect width="180" height="30" rx="8" fill="#007ACC" fill-opacity="0.15" stroke="#007ACC" stroke-opacity="0.4" />
    <path d="M16 15l3 3 6-6" fill="none" stroke="#38BDF8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="32" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#38BDF8" letter-spacing="0.5">DEV WORKFLOW PRO</text>
  </g>
</svg>