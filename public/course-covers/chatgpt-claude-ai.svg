<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-ai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1913" />
      <stop offset="45%" stop-color="#0e1322" />
      <stop offset="100%" stop-color="#070a14" />
    </linearGradient>
    <linearGradient id="accent-openai" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10a37f" />
      <stop offset="100%" stop-color="#2dd4bf" />
    </linearGradient>
    <linearGradient id="accent-claude" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d97706" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <filter id="glow-teal" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#bg-ai)" />

  <!-- Technical Grid Overlay -->
  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <path d="M0 75h800M0 150h800M0 225h800M0 300h800M0 375h800" />
    <path d="M100 0v450M200 0v450M300 0v450M400 0v450M500 0v450M600 0v450M700 0v450" />
  </g>

  <!-- Ambient Light Orbs -->
  <circle cx="680" cy="110" r="160" fill="#10a37f" opacity="0.18" filter="url(#glow-teal)" />
  <circle cx="710" cy="340" r="140" fill="#d97706" opacity="0.14" filter="url(#glow-teal)" />

  <!-- Top Brand Tag -->
  <g transform="translate(60, 50)">
    <rect width="142" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18" />
    <circle cx="18" cy="16" r="4.5" fill="#10a37f" />
    <text x="32" y="20.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#E2E8F0" letter-spacing="1.2">LEARNIFY AI</text>
  </g>

  <!-- Dual AI Brand Icons (OpenAI Swirl + Claude Spark) -->
  <g transform="translate(560, 150)">
    <!-- OpenAI Emblem Backdrop -->
    <rect x="0" y="0" width="80" height="80" rx="20" fill="#10a37f" fill-opacity="0.15" stroke="#10a37f" stroke-width="1.5" stroke-opacity="0.4" />
    <!-- OpenAI Iconic Knot Outline -->
    <path d="M40 22a9 9 0 0 1 8.5 6l6.5-1.5a18 18 0 0 0-15-10.5V22zm15 12a9 9 0 0 1 1 10.4l5.5 3.5a18 18 0 0 0 1.5-18.4L55 34zm-5 18a9 9 0 0 1-7.5 4.5v6.5a18 18 0 0 0 16.5-8L50 52zm-18 2a9 9 0 0 1-8.5-6L17 49.5a18 18 0 0 0 15 10.5V54zm-15-12a9 9 0 0 1-1-10.4l-5.5-3.5a18 18 0 0 0-1.5 18.4L17 42zm5-18a9 9 0 0 1 7.5-4.5V13a18 18 0 0 0-16.5 8L22 24z" fill="#10a37f" />

    <!-- Claude Spark Emblem Backdrop -->
    <rect x="100" y="20" width="80" height="80" rx="20" fill="#d97706" fill-opacity="0.15" stroke="#d97706" stroke-width="1.5" stroke-opacity="0.4" />
    <!-- Claude Asterisk Spark -->
    <path d="M140 36l3 16 16-3-12 11 12 11-16-3-3 16-7-14-14 7 9-13-13-9 15-1 7-14z" fill="#f59e0b" />
  </g>

  <!-- Main Course Title & Category -->
  <g transform="translate(60, 180)">
    <rect x="0" y="-30" width="120" height="5" rx="2.5" fill="url(#accent-openai)" />
    <text x="0" y="2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#38BDF8" letter-spacing="1.5" text-transform="uppercase">AI &amp; PRODUCTIVITY MASTERCLASS</text>
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Space Grotesk', 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">ChatGPT &amp; Claude AI</text>
    <text x="0" y="100" font-family="-apple-system, BlinkMacSystemFont, 'Space Grotesk', 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="900" fill="#2DD4BF" letter-spacing="-0.5">Productivity</text>
    <text x="0" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#94A3B8">Prompt Engineering • Claude Projects • Autonomous Agents • Workflow Automation</text>
  </g>

  <!-- Badges at bottom -->
  <g transform="translate(60, 375)">
    <rect width="105" height="32" rx="8" fill="#10a37f" fill-opacity="0.2" stroke="#10a37f" stroke-opacity="0.5" />
    <text x="18" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#2DD4BF" letter-spacing="0.5">CERTIFIED</text>

    <rect x="118" y="0" width="130" height="32" rx="8" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.15" />
    <text x="134" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#CBD5E1">7 Rich Lessons</text>

    <rect x="260" y="0" width="110" height="32" rx="8" fill="#6366F1" fill-opacity="0.15" stroke="#6366F1" stroke-opacity="0.3" />
    <text x="276" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#A5B4FC">Hands-on IDE</text>
  </g>
</svg>