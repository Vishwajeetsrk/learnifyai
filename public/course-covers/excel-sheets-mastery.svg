<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-excel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#062217" />
      <stop offset="50%" stop-color="#0a1420" />
      <stop offset="100%" stop-color="#05070c" />
    </linearGradient>
    <linearGradient id="accent-excel" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#107c41" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <filter id="glow-green" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg-excel)" />

  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <path d="M0 75h800M0 150h800M0 225h800M0 300h800M0 375h800" />
    <path d="M100 0v450M200 0v450M300 0v450M400 0v450M500 0v450M600 0v450M700 0v450" />
  </g>

  <circle cx="680" cy="130" r="150" fill="#107c41" opacity="0.22" filter="url(#glow-green)" />

  <!-- Brand Tag -->
  <g transform="translate(60, 50)">
    <rect width="142" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18" />
    <circle cx="18" cy="16" r="4.5" fill="#22c55e" />
    <text x="32" y="20.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#E2E8F0" letter-spacing="1.2">LEARNIFY AI</text>
  </g>

  <!-- Spreadsheet Grid & Excel "X" Graphic on Right -->
  <g transform="translate(600, 150)">
    <rect x="0" y="0" width="140" height="100" rx="14" fill="#0f291e" stroke="#22c55e" stroke-width="2" stroke-opacity="0.7" />
    <!-- Sheet Grid Lines -->
    <path d="M0 35h140M0 68h140M45 0v100M92 0v100" stroke="#22c55e" stroke-width="1" stroke-opacity="0.3" />
    <!-- Emerald Floating Icon "X" -->
    <rect x="-15" y="25" width="48" height="48" rx="12" fill="#107c41" stroke="#4ade80" stroke-width="1.5" />
    <text x="9" y="58" font-family="-apple-system, BlinkMacSystemFont, 'Space Grotesk', sans-serif" font-size="28" font-weight="900" fill="#FFFFFF">X</text>
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(60, 180)">
    <rect x="0" y="-30" width="110" height="5" rx="2.5" fill="url(#accent-excel)" />
    <text x="0" y="2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#4ADE80" letter-spacing="1.5" text-transform="uppercase">BUSINESS ANALYTICS &amp; FINANCE</text>
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Space Grotesk', 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">Excel &amp; Google Sheets</text>
    <text x="0" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Space Grotesk', 'Segoe UI', Roboto, sans-serif" font-size="40" font-weight="900" fill="#22C55E" letter-spacing="-0.5">Mastery Bootcamp</text>
    <text x="0" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#94A3B8">Formulas • Pivot Tables • XLOOKUP • Executive Dashboards • Data Visualization</text>
  </g>

  <!-- Badges at bottom -->
  <g transform="translate(60, 375)">
    <rect width="105" height="32" rx="8" fill="#107c41" fill-opacity="0.25" stroke="#107c41" stroke-opacity="0.6" />
    <text x="18" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#4ADE80" letter-spacing="0.5">CERTIFIED</text>

    <rect x="118" y="0" width="130" height="32" rx="8" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.15" />
    <text x="134" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#CBD5E1">7 Hands-on Labs</text>

    <rect x="260" y="0" width="125" height="32" rx="8" fill="#22C55E" fill-opacity="0.15" stroke="#22C55E" stroke-opacity="0.3" />
    <text x="274" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#86EFAC">Data Analytics</text>
  </g>
</svg>