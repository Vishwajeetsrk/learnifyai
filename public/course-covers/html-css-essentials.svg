<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-web" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#140E20" />
      <stop offset="50%" stop-color="#0E1222" />
      <stop offset="100%" stop-color="#050711" />
    </linearGradient>
    <filter id="glow-web" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg-web)" />

  <!-- Ambient Glows -->
  <circle cx="580" cy="180" r="160" fill="#E34F26" opacity="0.2" filter="url(#glow-web)" />
  <circle cx="700" cy="270" r="140" fill="#1572B6" opacity="0.2" filter="url(#glow-web)" />

  <!-- Grid mesh -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
    <path d="M0 75h800M0 150h800M0 225h800M0 300h800M0 375h800" />
    <path d="M100 0v450M200 0v450M300 0v450M400 0v450M500 0v450M600 0v450M700 0v450" />
  </g>

  <!-- Brand Badge Top Left -->
  <g transform="translate(60, 50)">
    <rect width="140" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18" />
    <circle cx="18" cy="16" r="4.5" fill="#F97316" />
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#E2E8F0" letter-spacing="1.2">LEARNIFY AI</text>
  </g>

  <!-- Category Tag -->
  <g transform="translate(60, 96)">
    <rect width="90" height="24" rx="6" fill="#F97316" fill-opacity="0.15" stroke="#F97316" stroke-opacity="0.35" />
    <text x="12" y="16.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#FB923C" letter-spacing="0.5">WEB DEV</text>
  </g>

  <!-- Left Content Info -->
  <g transform="translate(60, 185)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">HTML &amp; CSS Essentials</text>
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#94A3B8">Semantic HTML5 • CSS Flexbox &amp; Grid • Responsive Design</text>
    
    <!-- Highlights pills -->
    <g transform="translate(0, 75)">
      <rect width="130" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12" />
      <circle cx="14" cy="14" r="3" fill="#E34F26" />
      <text x="24" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#CBD5E1">Modern Semantic</text>
    </g>
    <g transform="translate(140, 75)">
      <rect width="128" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12" />
      <circle cx="14" cy="14" r="3" fill="#1572B6" />
      <text x="24" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#CBD5E1">Flexbox &amp; Grid</text>
    </g>
    <g transform="translate(278, 75)">
      <rect width="138" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12" />
      <circle cx="14" cy="14" r="3" fill="#10B981" />
      <text x="24" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#CBD5E1">Mobile Responsive</text>
    </g>
  </g>

  <!-- Right Visual: HTML5 + CSS3 Dual Shields -->
  <g transform="translate(610, 220)">
    <!-- Glass Container -->
    <rect x="-115" y="-105" width="230" height="210" rx="36" fill="#111827" fill-opacity="0.85" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="2" />
    
    <!-- HTML5 Shield (Left) -->
    <g transform="translate(-80, -75) scale(0.9)">
      <path d="M12 0l8 90 35 10 35-10 8-90H12z" fill="#E34F26" />
      <path d="M55 8l30 0-6 75-24 7V8z" fill="#EF652A" />
      <!-- '5' glyph in HTML -->
      <path d="M25 24h60l-2 16H42l2 18h40l-5 46-24 7-24-7-2-19h15l1 9 10 3 10-3 3-23H28z" fill="#FFFFFF" />
    </g>

    <!-- CSS3 Shield (Right) -->
    <g transform="translate(5, -45) scale(0.9)">
      <path d="M12 0l8 90 35 10 35-10 8-90H12z" fill="#1572B6" />
      <path d="M55 8l30 0-6 75-24 7V8z" fill="#33A9DC" />
      <!-- '3' glyph in CSS -->
      <path d="M25 24h60l-2 16H42l2 14h40l-5 50-24 7-24-7-2-19h15l1 9 10 3 10-3 3-23H28z" fill="#FFFFFF" />
    </g>
  </g>

  <!-- Bottom Bar: Verified Certification -->
  <g transform="translate(60, 375)">
    <rect width="180" height="30" rx="8" fill="#F97316" fill-opacity="0.15" stroke="#F97316" stroke-opacity="0.4" />
    <path d="M16 15l3 3 6-6" fill="none" stroke="#FB923C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="32" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#FB923C" letter-spacing="0.5">VERIFIED PORTFOLIO</text>
  </g>
</svg>