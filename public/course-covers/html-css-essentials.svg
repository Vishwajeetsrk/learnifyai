<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-html-css-essentials" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1572B6" />
      <stop offset="60%" stop-color="#0B0F19" />
      <stop offset="100%" stop-color="#05070B" />
    </linearGradient>
    <linearGradient id="accent-html-css-essentials" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E34F26" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#bg-html-css-essentials)" />
  <!-- Pattern Grid -->
  <g opacity="0.06">
    <path d="M0 50h800M0 100h800M0 150h800M0 200h800M0 250h800M0 300h800M0 350h800M0 400h800" stroke="#FFF" stroke-width="1" />
    <path d="M100 0v450M200 0v450M300 0v450M400 0v450M500 0v450M600 0v450M700 0v450" stroke="#FFF" stroke-width="1" />
  </g>
  <!-- Decorative Orb -->
  <circle cx="680" cy="120" r="140" fill="#E34F26" opacity="0.12" filter="blur(40px)" />
  <circle cx="120" cy="360" r="120" fill="#6366F1" opacity="0.1" filter="blur(40px)" />
  
  <!-- Brand Badge Top Left -->
  <g transform="translate(60, 60)">
    <rect width="130" height="34" rx="8" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.15" />
    <circle cx="20" cy="17" r="5" fill="#E34F26" />
    <text x="34" y="22" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#FFFFFF" letter-spacing="1">LEARNIFY AI</text>
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(60, 200)">
    <rect x="0" y="-30" width="80" height="4" rx="2" fill="url(#accent-html-css-essentials)" />
    <text x="0" y="24" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="34" font-weight="800" fill="#FFFFFF">HTML5 & Modern CSS Essentials</text>
    <text x="0" y="65" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#94A3B8">Comprehensive curriculum • Hands-on projects • Career certification</text>
  </g>

  <!-- Level / Badge footer -->
  <g transform="translate(60, 370)">
    <rect width="84" height="28" rx="6" fill="#E34F26" fill-opacity="0.2" stroke="#E34F26" stroke-opacity="0.4" />
    <text x="14" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#E34F26">CERTIFIED</text>
  </g>
</svg>