<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-ux" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035" />
      <stop offset="50%" stop-color="#0c0e1a" />
      <stop offset="100%" stop-color="#06070d" />
    </linearGradient>
    <linearGradient id="accent-ux" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>
    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg-ux)" />

  <g opacity="0.08" stroke="#FFFFFF" stroke-width="1">
    <path d="M0 75h800M0 150h800M0 225h800M0 300h800M0 375h800" />
    <path d="M100 0v450M200 0v450M300 0v450M400 0v450M500 0v450M600 0v450M700 0v450" />
  </g>

  <circle cx="680" cy="120" r="150" fill="#8b5cf6" opacity="0.18" filter="url(#glow-purple)" />
  <circle cx="640" cy="330" r="130" fill="#ec4899" opacity="0.14" filter="url(#glow-purple)" />

  <!-- Brand Tag -->
  <g transform="translate(60, 50)">
    <rect width="142" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18" />
    <circle cx="18" cy="16" r="4.5" fill="#8b5cf6" />
    <text x="32" y="20.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#E2E8F0" letter-spacing="1.2">LEARNIFY AI</text>
  </g>

  <!-- Visual UI/UX Figma Vector Art on Right -->
  <g transform="translate(590, 150)">
    <!-- Layer Card 1 -->
    <rect x="0" y="30" width="120" height="90" rx="14" fill="#1e1035" stroke="#8b5cf6" stroke-width="2" stroke-opacity="0.6" opacity="0.7" />
    <!-- Layer Card 2 Top (Active Glass Card) -->
    <rect x="25" y="0" width="130" height="95" rx="16" fill="#2e1065" fill-opacity="0.8" stroke="#ec4899" stroke-width="2" stroke-opacity="0.8" />
    <!-- Mini UI Wireframe Bars inside Active Card -->
    <rect x="40" y="20" width="35" height="6" rx="3" fill="#ec4899" />
    <rect x="40" y="32" width="75" height="4" rx="2" fill="#FFFFFF" opacity="0.4" />
    <rect x="40" y="42" width="55" height="4" rx="2" fill="#FFFFFF" opacity="0.3" />
    <circle cx="125" cy="65" r="14" fill="#8b5cf6" opacity="0.9" />
  </g>

  <!-- Title & Subtitle -->
  <g transform="translate(60, 180)">
    <rect x="0" y="-30" width="110" height="5" rx="2.5" fill="url(#accent-ux)" />
    <text x="0" y="2" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#C084FC" letter-spacing="1.5" text-transform="uppercase">PRODUCT DESIGN &amp; HUMAN INTERACTION</text>
    <text x="0" y="52" font-family="-apple-system, BlinkMacSystemFont, 'Space Grotesk', 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">Designing User Interfaces</text>
    <text x="0" y="98" font-family="-apple-system, BlinkMacSystemFont, 'Space Grotesk', 'Segoe UI', Roboto, sans-serif" font-size="38" font-weight="900" fill="#F472B6" letter-spacing="-0.5">&amp; Experiences (UI/UX)</text>
    <text x="0" y="145" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="15" font-weight="500" fill="#94A3B8">User Centered Design (UCD) • Design Systems • Figma Auto Layout • 72 Lessons</text>
  </g>

  <!-- Badges at bottom -->
  <g transform="translate(60, 375)">
    <rect width="105" height="32" rx="8" fill="#8b5cf6" fill-opacity="0.2" stroke="#8b5cf6" stroke-opacity="0.5" />
    <text x="18" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="800" fill="#C084FC" letter-spacing="0.5">CERTIFIED</text>

    <rect x="118" y="0" width="130" height="32" rx="8" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.15" />
    <text x="134" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#CBD5E1">72 Full Lessons</text>

    <rect x="260" y="0" width="115" height="32" rx="8" fill="#EC4899" fill-opacity="0.15" stroke="#EC4899" stroke-opacity="0.3" />
    <text x="276" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" fill="#F472B6">Figma Master</text>
  </g>
</svg>