<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450">
  <defs>
    <linearGradient id="bg-ms" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141126" />
      <stop offset="50%" stop-color="#0F1424" />
      <stop offset="100%" stop-color="#060812" />
    </linearGradient>
    <filter id="glow-ms" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="30" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <rect width="800" height="450" fill="url(#bg-ms)" />

  <!-- Ambient Glows -->
  <circle cx="600" cy="170" r="150" fill="#2B579A" opacity="0.22" filter="url(#glow-ms)" />
  <circle cx="700" cy="270" r="140" fill="#D24726" opacity="0.2" filter="url(#glow-ms)" />

  <!-- Grid mesh -->
  <g opacity="0.05" stroke="#FFFFFF" stroke-width="1">
    <path d="M0 75h800M0 150h800M0 225h800M0 300h800M0 375h800" />
    <path d="M100 0v450M200 0v450M300 0v450M400 0v450M500 0v450M600 0v450M700 0v450" />
  </g>

  <!-- Brand Badge Top Left -->
  <g transform="translate(60, 50)">
    <rect width="140" height="32" rx="16" fill="#FFFFFF" fill-opacity="0.08" stroke="#FFFFFF" stroke-opacity="0.18" />
    <circle cx="18" cy="16" r="4.5" fill="#3B82F6" />
    <text x="32" y="21" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#E2E8F0" letter-spacing="1.2">LEARNIFY AI</text>
  </g>

  <!-- Category Tag -->
  <g transform="translate(60, 96)">
    <rect width="112" height="24" rx="6" fill="#3B82F6" fill-opacity="0.15" stroke="#3B82F6" stroke-opacity="0.35" />
    <text x="12" y="16.5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="700" fill="#60A5FA" letter-spacing="0.5">PRODUCTIVITY</text>
  </g>

  <!-- Left Content Info -->
  <g transform="translate(60, 185)">
    <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="36" font-weight="900" fill="#FFFFFF" letter-spacing="-0.5">Word &amp; PowerPoint Pro</text>
    <text x="0" y="38" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="16" font-weight="500" fill="#94A3B8">Executive Documents • Pitch Decks • AI Formatting • Templates</text>
    
    <!-- Highlights pills -->
    <g transform="translate(0, 75)">
      <rect width="138" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12" />
      <circle cx="14" cy="14" r="3" fill="#2B579A" />
      <text x="24" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#CBD5E1">Doc Architecture</text>
    </g>
    <g transform="translate(148, 75)">
      <rect width="132" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12" />
      <circle cx="14" cy="14" r="3" fill="#D24726" />
      <text x="24" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#CBD5E1">C-Level Slides</text>
    </g>
    <g transform="translate(290, 75)">
      <rect width="136" height="28" rx="14" fill="#FFFFFF" fill-opacity="0.06" stroke="#FFFFFF" stroke-opacity="0.12" />
      <circle cx="14" cy="14" r="3" fill="#38BDF8" />
      <text x="24" y="18" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" fill="#CBD5E1">Copilot Workflows</text>
    </g>
  </g>

  <!-- Right Visual: Word Blue + PowerPoint Orange Badges -->
  <g transform="translate(600, 220)">
    <!-- Word Card (Left offset) -->
    <g transform="translate(-70, -40)">
      <rect width="100" height="110" rx="18" fill="#1E3A8A" fill-opacity="0.85" stroke="#3B82F6" stroke-opacity="0.4" stroke-width="2" />
      <text x="50" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF">W</text>
      <!-- Doc lines -->
      <line x1="25" y1="26" x2="75" y2="26" stroke="#93C5FD" stroke-width="2.5" stroke-linecap="round" />
    </g>

    <!-- PowerPoint Card (Right offset overlapping) -->
    <g transform="translate(0, 10)">
      <rect width="100" height="110" rx="18" fill="#991B1B" fill-opacity="0.85" stroke="#EF4444" stroke-opacity="0.4" stroke-width="2" />
      <text x="50" y="70" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="44" font-weight="900" fill="#FFFFFF">P</text>
      <!-- Slide chart pie slice -->
      <circle cx="50" cy="28" r="8" fill="none" stroke="#FCA5A5" stroke-width="3" stroke-dasharray="35 50" />
    </g>
  </g>

  <!-- Bottom Bar: Verified Certification -->
  <g transform="translate(60, 375)">
    <rect width="180" height="30" rx="8" fill="#3B82F6" fill-opacity="0.15" stroke="#3B82F6" stroke-opacity="0.4" />
    <path d="M16 15l3 3 6-6" fill="none" stroke="#60A5FA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    <text x="32" y="19" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="800" fill="#60A5FA" letter-spacing="0.5">CAREER CERTIFIED</text>
  </g>
</svg>