<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="520" height="400" viewBox="0 0 520 400">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1120"/>
      <stop offset="1" stop-color="#312e81"/>
    </linearGradient>
    <linearGradient id="gearGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#a5b4fc"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="boltGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <rect width="520" height="400" rx="36" fill="url(#bg)"/>
  <circle cx="120" cy="80" r="3" fill="#ffffff" opacity="0.35"/>
  <circle cx="430" cy="60" r="2" fill="#ffffff" opacity="0.3"/>
  <circle cx="470" cy="180" r="3" fill="#ffffff" opacity="0.25"/>
  <circle cx="70" cy="300" r="2" fill="#ffffff" opacity="0.3"/>
  <circle cx="460" cy="330" r="2.5" fill="#ffffff" opacity="0.25"/>
  <circle cx="200" cy="50" r="2" fill="#ffffff" opacity="0.2"/>

  <g transform="translate(260 190)">
    <g filter="url(#shadow)">
      <circle r="118" fill="#0f172a" fill-opacity="0.55"/>
      <circle r="118" fill="none" stroke="#6366f1" stroke-opacity="0.45" stroke-width="7"/>
      <circle r="92" fill="none" stroke="#a5b4fc" stroke-opacity="0.28" stroke-width="5" stroke-dasharray="8 10">
        <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="14s" repeatCount="indefinite"/>
      </circle>
    </g>

    <g filter="url(#glow)">
      <g transform="translate(0 -26)">
        <g>
          <animateTransform attributeName="transform" type="rotate" from="0 0 26" to="360 0 26" dur="9s" repeatCount="indefinite"/>
          <path d="M-10 -46 L10 -46 L10 -24 L-10 -24 Z" fill="url(#gearGrad)" opacity="0.95"/>
          <circle cx="0" cy="-35" r="11" fill="#0b1120"/>
        </g>
        <g>
          <animateTransform attributeName="transform" type="rotate" from="180 0 -30" to="540 0 -30" dur="9s" repeatCount="indefinite"/>
          <path d="M-10 -52 L10 -52 L10 -30 L-10 -30 Z" fill="url(#gearGrad)" opacity="0.7"/>
          <circle cx="0" cy="-41" r="9" fill="#0b1120"/>
        </g>
      </g>
      <path d="M-13 -6 L9 -6 L2 12 L18 12 L-4 42 L5 16 L-13 16 Z" fill="url(#boltGrad)">
        <animate attributeName="opacity" values="0.55;1;0.55" dur="2.4s" repeatCount="indefinite"/>
      </path>
    </g>
  </g>

  <g filter="url(#glow)">
    <circle cx="420" cy="86" r="9" fill="#f472b6" opacity="0.9">
      <animate attributeName="r" values="6;10;6" dur="2.8s" repeatCount="indefinite"/>
    </circle>
    <circle cx="88" cy="160" r="7" fill="#34d399" opacity="0.8">
      <animate attributeName="r" values="4;8;4" dur="3.2s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="260" y="338" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="bold" fill="#e2e8f0" letter-spacing="1">LEARNIFY AI</text>
  <text x="260" y="368" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#818cf8" letter-spacing="3">MAINTENANCE TIME</text>
</svg>
