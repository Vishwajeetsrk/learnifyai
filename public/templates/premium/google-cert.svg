<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 842 595" width="842" height="595">
  <!-- Clean white-grey background -->
  <rect width="842" height="595" fill="#fafafa"/>
  <rect x="25" y="25" width="792" height="545" fill="#ffffff" stroke="#e0e0e0" stroke-width="1"/>
  
  <!-- Sleek sidebar margin line in Google colors -->
  <line x1="28" y1="28" x2="28" y2="567" stroke="#4285f4" stroke-width="4"/>
  <line x1="28" y1="28" x2="250" y2="28" stroke="#4285f4" stroke-width="4"/>
  
  <!-- Google Colored Dots Watermark in corners -->
  <circle cx="800" cy="40" r="8" fill="#ea4335" opacity="0.8"/>
  <circle cx="780" cy="40" r="8" fill="#fbbc05" opacity="0.8"/>
  <circle cx="760" cy="40" r="8" fill="#34a853" opacity="0.8"/>
  <circle cx="740" cy="40" r="8" fill="#4285f4" opacity="0.8"/>

  <!-- Google Cloud/IT Crest Seal (vector graphic) -->
  <g transform="translate(421, 500) scale(0.65)" opacity="0.9">
    <circle cx="0" cy="0" r="50" fill="#f8f9fa" stroke="#4285f4" stroke-width="2"/>
    <!-- Inner stars -->
    <path d="M 0,-30 L 7,-10 L 28,-10 L 11,3 L 17,24 L 0,11 L -17,24 L -11,3 L -28,-10 L -7,-10 Z" fill="#fbbc05"/>
    <circle cx="0" cy="0" r="30" fill="none" stroke="#34a853" stroke-width="1.5" stroke-dasharray="4,3"/>
  </g>

  <!-- Accreditation Stamps (MSME & NSDC style placeholders) -->
  <g transform="translate(680, 475) scale(0.8)">
    <!-- MSME stamp -->
    <rect x="0" y="0" width="70" height="35" rx="4" fill="none" stroke="#34a853" stroke-width="1.5"/>
    <text x="35" y="15" font-family="Inter, sans-serif" font-size="7" font-weight="bold" fill="#34a853" text-anchor="middle">GOVT OF INDIA</text>
    <text x="35" y="27" font-family="Inter, sans-serif" font-size="9" font-weight="extrabold" fill="#34a853" text-anchor="middle">MSME</text>
  </g>
  <g transform="translate(580, 475) scale(0.8)">
    <!-- ISO stamp -->
    <circle cx="25" cy="18" r="18" fill="none" stroke="#4285f4" stroke-width="1.5"/>
    <text x="25" y="15" font-family="Inter, sans-serif" font-size="6" font-weight="bold" fill="#4285f4" text-anchor="middle">ISO Certified</text>
    <text x="25" y="25" font-family="Inter, sans-serif" font-size="8" font-weight="extrabold" fill="#4285f4" text-anchor="middle">9001:2015</text>
  </g>

  <!-- Security Guarantees / QR Code border -->
  <rect x="50" y="445" width="80" height="80" rx="6" fill="#f8f9fa" stroke="#e0e0e0" stroke-width="1"/>
  <path d="M 55,450 L 65,450 L 65,460" fill="none" stroke="#4285f4" stroke-width="2"/>
  <path d="M 125,450 L 115,450 L 115,460" fill="none" stroke="#4285f4" stroke-width="2"/>
  <path d="M 55,520 L 65,520 L 65,510" fill="none" stroke="#4285f4" stroke-width="2"/>
  <path d="M 125,520 L 115,520 L 115,510" fill="none" stroke="#4285f4" stroke-width="2"/>
  <text x="90" y="538" font-family="Inter, sans-serif" font-size="7" fill="#888888" text-anchor="middle" font-weight="600">SCAN TO VERIFY</text>

  <!-- Subtle grid watermark -->
  <path d="M 0,0" stroke="#f1f3f4" stroke-width="0.5"/>
</svg>
