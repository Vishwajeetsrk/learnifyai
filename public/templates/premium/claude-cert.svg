<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 842 595" width="842" height="595">
  <!-- Warm cream-grey background -->
  <rect width="842" height="595" fill="#faf8f5"/>
  
  <!-- Minimalist Thin Bronze double border -->
  <rect x="30" y="30" width="782" height="535" fill="none" stroke="#d0c7b6" stroke-width="1"/>
  <rect x="34" y="34" width="774" height="527" fill="none" stroke="#8a7e6b" stroke-width="1.5"/>

  <!-- Top Accent Constellation Graphics -->
  <g stroke="#d0c7b6" stroke-width="0.75" opacity="0.6">
    <circle cx="100" cy="80" r="3" fill="#8a7e6b"/>
    <circle cx="140" cy="60" r="2" fill="none"/>
    <circle cx="180" cy="90" r="4" fill="none"/>
    <line x1="100" y1="80" x2="140" y2="60"/>
    <line x1="140" y1="60" x2="180" y2="90"/>
    
    <circle cx="740" cy="80" r="3" fill="#8a7e6b"/>
    <circle cx="700" cy="60" r="2" fill="none"/>
    <circle cx="660" cy="90" r="4" fill="none"/>
    <line x1="740" y1="80" x2="700" y2="60"/>
    <line x1="700" y1="60" x2="660" y2="90"/>
  </g>

  <!-- Claude Style Golden Neural Seal (vector graphic) -->
  <g transform="translate(421, 485) scale(0.68)">
    <circle cx="0" cy="0" r="40" fill="#faf8f5" stroke="#8a7e6b" stroke-width="1.5"/>
    <circle cx="0" cy="0" r="34" fill="none" stroke="#d0c7b6" stroke-width="1" stroke-dasharray="3,3"/>
    <!-- Abstract Neural Connection Nodes inside seal -->
    <circle cx="0" cy="-12" r="3.5" fill="#8a7e6b"/>
    <circle cx="-12" cy="10" r="3.5" fill="#8a7e6b"/>
    <circle cx="12" cy="10" r="3.5" fill="#8a7e6b"/>
    <line x1="0" y1="-12" x2="-12" y2="10" stroke="#8a7e6b" stroke-width="1.5"/>
    <line x1="0" y1="-12" x2="12" y2="10" stroke="#8a7e6b" stroke-width="1.5"/>
    <line x1="-12" y1="10" x2="12" y2="10" stroke="#8a7e6b" stroke-width="1.5"/>
  </g>

  <!-- ISO Stamp placeholder -->
  <g transform="translate(680, 475) scale(0.8)">
    <rect x="0" y="0" width="70" height="35" rx="3" fill="none" stroke="#d0c7b6" stroke-width="1.5"/>
    <text x="35" y="15" font-family="Inter, sans-serif" font-size="7" font-weight="bold" fill="#8a7e6b" text-anchor="middle">VERIFIED</text>
    <text x="35" y="27" font-family="Inter, sans-serif" font-size="9" font-weight="extrabold" fill="#8a7e6b" text-anchor="middle">CLAUDE AI</text>
  </g>

  <!-- QR borders -->
  <rect x="60" y="445" width="80" height="80" rx="6" fill="#ffffff" stroke="#d0c7b6" stroke-width="1"/>
  <path d="M 65,450 L 75,450 L 75,460" fill="none" stroke="#8a7e6b" stroke-width="2"/>
  <path d="M 135,450 L 125,450 L 125,460" fill="none" stroke="#8a7e6b" stroke-width="2"/>
  <path d="M 65,520 L 75,520 L 75,510" fill="none" stroke="#8a7e6b" stroke-width="2"/>
  <path d="M 135,520 L 125,520 L 125,510" fill="none" stroke="#8a7e6b" stroke-width="2"/>
  <text x="100" y="538" font-family="Inter, sans-serif" font-size="7" fill="#888888" text-anchor="middle" font-weight="600">VERIFY SECURE</text>
</svg>
