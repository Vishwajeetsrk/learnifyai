<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 842 595" width="842" height="595">
  <!-- Premium Dark Developer Background -->
  <rect width="842" height="595" fill="#080a13"/>
  
  <!-- Linear Gradient definitions for Neon borders -->
  <defs>
    <linearGradient id="neon-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="50%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#fe007c"/>
    </linearGradient>
    <linearGradient id="glow-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#7c3aed" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Glowing background details -->
  <rect x="25" y="25" width="792" height="3" fill="url(#glow-grad)"/>
  
  <!-- Glowing double border frame in Neon gradient colors -->
  <rect x="25" y="25" width="792" height="545" fill="none" stroke="url(#neon-grad)" stroke-width="2"/>
  <rect x="30" y="30" width="782" height="535" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.15"/>

  <!-- Matrix/Grid Monospaced Watermark in background -->
  <g stroke="#ffffff" stroke-width="0.25" stroke-opacity="0.05">
    <line x1="50" y1="30" x2="50" y2="565"/>
    <line x1="100" y1="30" x2="100" y2="565"/>
    <line x1="742" y1="30" x2="742" y2="565"/>
    <line x1="792" y1="30" x2="792" y2="565"/>
    
    <line x1="30" y1="50" x2="812" y2="50"/>
    <line x1="30" y1="100" x2="812" y2="100"/>
    <line x1="30" y1="495" x2="812" y2="495"/>
    <line x1="30" y1="545" x2="812" y2="545"/>
  </g>

  <!-- Codex Coding Badge Seal -->
  <g transform="translate(421, 480) scale(0.65)" opacity="0.9">
    <circle cx="0" cy="0" r="45" fill="#080a13" stroke="url(#neon-grad)" stroke-width="2"/>
    <circle cx="0" cy="0" r="38" fill="none" stroke="#ffffff" stroke-width="0.5" stroke-opacity="0.2" stroke-dasharray="5,3"/>
    <!-- Terminal Code Tag Bracket Symbols inside seal -->
    <path d="M -15,-10 L -25,0 L -15,10" fill="none" stroke="#00f2fe" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 15,-10 L 25,0 L 15,10" fill="none" stroke="#fe007c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="-5" y1="14" x2="5" y2="-14" stroke="#ffffff" stroke-width="2" stroke-opacity="0.7"/>
  </g>

  <!-- Govt of India / ISO stamps in neon style -->
  <g transform="translate(680, 475) scale(0.8)">
    <rect x="0" y="0" width="70" height="35" rx="4" fill="none" stroke="#7c3aed" stroke-width="1.5"/>
    <text x="35" y="15" font-family="monospace" font-size="7" font-weight="bold" fill="#7c3aed" text-anchor="middle">VERIFIED</text>
    <text x="35" y="27" font-family="monospace" font-size="9" font-weight="extrabold" fill="#7c3aed" text-anchor="middle">CODEX IDE</text>
  </g>

  <!-- Security Verification QR Border -->
  <rect x="60" y="445" width="80" height="80" rx="6" fill="#0c0f1d" stroke="#ffffff" stroke-opacity="0.1" stroke-width="1"/>
  <path d="M 65,450 L 75,450 L 75,460" fill="none" stroke="#00f2fe" stroke-width="2"/>
  <path d="M 135,450 L 125,450 L 125,460" fill="none" stroke="#00f2fe" stroke-width="2"/>
  <path d="M 65,520 L 75,520 L 75,510" fill="none" stroke="#fe007c" stroke-width="2"/>
  <path d="M 135,520 L 125,520 L 125,510" fill="none" stroke="#fe007c" stroke-width="2"/>
  <text x="100" y="538" font-family="monospace" font-size="7" fill="#888888" text-anchor="middle" font-weight="600">VERIFY DATA</text>
</svg>
