<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 842 595" width="842" height="595">
  <!-- Elegant Ivory Parchment Background -->
  <rect width="842" height="595" fill="#fdfaf4"/>
  
  <!-- Classic Ornate Gold Border Frame -->
  <rect x="25" y="25" width="792" height="545" fill="none" stroke="#d4af37" stroke-width="4"/>
  <rect x="33" y="33" width="776" height="529" fill="none" stroke="#8a6d2b" stroke-width="1"/>
  
  <!-- Corner Ornate Flourishes -->
  <!-- Top Left -->
  <path d="M 25,60 L 60,25" stroke="#d4af37" stroke-width="2"/>
  <circle cx="65" cy="65" r="5" fill="#8a6d2b"/>
  <!-- Top Right -->
  <path d="M 817,60 L 782,25" stroke="#d4af37" stroke-width="2"/>
  <circle cx="777" cy="65" r="5" fill="#8a6d2b"/>
  <!-- Bottom Left -->
  <path d="M 25,535 L 60,570" stroke="#d4af37" stroke-width="2"/>
  <circle cx="65" cy="530" r="5" fill="#8a6d2b"/>
  <!-- Bottom Right -->
  <path d="M 817,535 L 782,570" stroke="#d4af37" stroke-width="2"/>
  <circle cx="777" cy="530" r="5" fill="#8a6d2b"/>

  <!-- University Seal / Crest Watermark at center -->
  <g transform="translate(421, 297.5) scale(2.0)" opacity="0.04">
    <circle cx="0" cy="0" r="60" fill="none" stroke="#8a6d2b" stroke-width="2"/>
    <path d="M-30,-20 L30,-20 L20,30 L-20,30 Z" fill="none" stroke="#8a6d2b" stroke-width="2"/>
    <path d="M-10,-5 L10,-5 L0,15 Z" fill="#8a6d2b"/>
  </g>

  <!-- Gold Foil Seal at bottom center -->
  <g transform="translate(421, 485) scale(0.72)">
    <!-- Starburst points -->
    <path d="M0,-45 L9,-15 L39,-27 L21,3 L44,22 L14,21 L14,51 L-9,30 L-32,44 L-21,14 L-45,-4 L-15,-6 L-9,-36 Z" fill="#d4af37"/>
    <circle cx="0" cy="0" r="32" fill="#c5a028" stroke="#f0e2a4" stroke-width="1.5"/>
    <text x="0" y="4" font-family="Cinzel, serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">OFFICIAL</text>
  </g>

  <!-- Security Verification block on bottom right -->
  <g transform="translate(670, 455) scale(0.8)">
    <rect x="0" y="0" width="80" height="80" rx="4" fill="#ffffff" stroke="#d4af37" stroke-width="1"/>
    <path d="M 5,5 L 15,5 L 15,15" fill="none" stroke="#8a6d2b" stroke-width="1.5"/>
    <path d="M 75,5 L 65,5 L 65,15" fill="none" stroke="#8a6d2b" stroke-width="1.5"/>
    <path d="M 5,75 L 15,75 L 15,65" fill="none" stroke="#8a6d2b" stroke-width="1.5"/>
    <path d="M 75,75 L 65,75 L 65,65" fill="none" stroke="#8a6d2b" stroke-width="1.5"/>
    <text x="40" y="93" font-family="Inter, sans-serif" font-size="7" fill="#8a6d2b" text-anchor="middle" font-weight="600">VERIFY SECURE</text>
  </g>
</svg>
